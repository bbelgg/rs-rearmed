# The iOS app's Xcode project, as XcodeGen makes it (LearnPlay.xcodeproj is committed, so building needs no
# XcodeGen; after a change here: xcodegen generate --spec ios/project.yml). The libraries it links, the game
# image and the DLLs come from ios/build_lp.sh (its lp.xcconfig, included by LearnPlay.xcconfig).
name: LearnPlay
options:
  bundleIdPrefix: io.github.rsrearmed
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: LearnPlay.xcconfig
  Release: LearnPlay.xcconfig
targets:
  LearnPlay:
    type: application
    platform: iOS
    sources:
      - path: app/lp_ios_app.m
      - path: app/Info.plist
        buildPhase: none
      - path: app/LearnPlay.entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: LearnPlay
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rsrearmed.learnplay.$(DEVELOPMENT_TEAM)
        INFOPLIST_FILE: app/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(LP_IOS_ENTITLEMENTS)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEBUG_INFORMATION_FORMAT: dwarf
        GCC_PREPROCESSOR_DEFINITIONS: LP_VERSION=\"$(LP_VERSION)\"
        HEADER_SEARCH_PATHS: $(SRCROOT)/compat $(SRCROOT)/../win-x86/app $(SRCROOT)/../shims/opengl/src $(SRCROOT)/../shims/platform/include $(LP_IOS_BUILD)/obj/gl/inc
        OTHER_LDFLAGS: $(LP_IOS_LIBS) -lc++ -lz -framework Foundation -framework CoreFoundation -framework Metal -framework QuartzCore -framework AudioToolbox -framework AVFAudio -framework CoreAudio -framework ImageIO -framework UniformTypeIdentifiers -framework UIKit
        "OTHER_LDFLAGS[sdk=iphoneos*]": $(LP_IOS_LIBS) -lc++ -lz -framework Foundation -framework CoreFoundation -framework Metal -framework QuartzCore -framework AudioToolbox -framework AVFAudio -framework CoreAudio -framework ImageIO -framework UniformTypeIdentifiers -framework UIKit -weak_framework MetalFX
    postCompileScripts:
      - name: The game image and the DLLs
        basedOnDependencyAnalysis: false
        script: |
          [ -d "$LP_IOS_BUNDLE" ] || { echo "error: no $LP_IOS_BUNDLE: run ios/build_lp.sh first"; exit 1; }
          cp -R "$LP_IOS_BUNDLE"/. "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/"
schemes:
  LearnPlay:
    build:
      targets:
        LearnPlay: all
    run:
      config: Release
