# The Windows game: Rocksmith 2014 Learn & Play (Steam app 221680, Windows depot 221683), the 32-bit PE the
# win-x86 build is made for, and the Microsoft DLLs it needs. Read by win-x86/install/lp_install.py.
#
# The same subset of TOML as tools/targets/<id>/target.toml (tools/targets/targets.py parse_toml: flat
# `key = "string" | integer`), so this file can move to tools/targets/win-x86/ once that target has its maps.
id = "win-x86"
description = "Rocksmith 2014 Learn & Play, Windows (x86-32 PE, Steam)"

# --- The game, downloaded with the Mac Steam client's console (`download_depot APP DEPOT [MANIFEST]`).
# App 221680's depots: 221681 Windows (the paid edition: "No subscription" for a Learn & Play account),
# 221682 macOS, 221683 Windows, the one Learn & Play grants.
steam_app = 221680
steam_depot = 221683
# The manifest to download: the current public one, verified to hold the exe below. Empty: the console
# downloads the latest manifest. Either way lp_install.py checks the exe's hash afterwards, and prints the
# manifest Steam reports.
depot_manifest = "8918188356915973501"
# The depot at that manifest on disk: 98 files, 5,857,456,194 bytes (Steam's log announces "103 files,
# 5363 MB", the manifest's entries and the compressed download). Steam makes every file at its full size
# before it fills it, so this much free space is needed up front, plus the margin.
depot_files = 98
depot_disk_bytes = 5857456194
disk_margin_bytes = 536870912
# Each DLC is a depot of its own, both kinds of archives: 143 of them took 2.18 GB on a Mac, 16 MB on average.
dlc_disk_bytes = 2362232012
dlc_average_bytes = 16777216
exe_name = "Rocksmith2014.exe"
exe_size = 24514584
exe_sha256 = "bb056959c0c6371d4ecf78f84c5d27e2fae93a9d0258830c2a36f33e6a2778eb"

# --- Microsoft DLLs the game loads. Never shipped: the installer takes them from the user's own Steam
# (Steamworks Common Redistributables, app 228980), else from Microsoft's redistributables, and checks
# every DLL's SHA-256 (the same from either source).
# Source 1: Steam's copy, under <Steam>/steamapps/common/Steamworks Shared/_CommonRedist/.
steam_vcredist = "vcredist/2010/vcredist_x86.exe"
steam_d3dx9_cab = "DirectX/Jun2010/Aug2009_d3dx9_42_x86.cab"
steam_d3dcompiler_cab = "DirectX/Jun2010/Aug2009_D3DCompiler_42_x86.cab"
# Source 2: Microsoft's downloads (the only network access of the install, and only when source 1 is missing).
vcredist_url = "https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x86.exe"
vcredist_sha256 = "99dce3c841cc6028560830f7866c9ce2928c98cf3256892ef8e6cf755147b0d8"
dxredist_url = "https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe"
dxredist_sha256 = "053f76dcbb28802e23341b6a787e3b0791c0fa5c8d4d011b1044172dbf89c73b"
# Source 3: the same packages as Steam depots (228983: VC++ 2010, 228990: DirectX June 2010), downloaded with
# the console into <Steam>/steamapps/content/app_228980/depot_<id>; searched like source 1.
steam_redist_app = 228980
steam_vcredist_depot = 228983
steam_dxredist_depot = 228990
# The DLLs: VC++ 2010 SP1 x86 (10.0.40219.1; F_CENTRAL_*_x86 in vc_red.cab) and DirectX June 2010 (August 2009 cabs).
msvcr100_sha256 = "60c06e0fa4449314da3a0a87c1a9d9577df99226f943637e06f61188e5862efa"
msvcp100_sha256 = "d769fafa2b3232de9fa7153212ba287f68e745257f1c00fafb511e7a02de7adf"
d3dx9_42_sha256 = "f8b9cfab7fffbc8f98e41aa439d72921dc180634a1febca2a9d41a0df35d3472"
d3dcompiler_42_sha256 = "6c976311406c23aa71018d274da0ecdef43b6e3a3b0b01e941a5e8e4e974386c"
# D3DCompiler_42 shares d3dx9_42's preferred base (0x10000000): it is written rebased (win-x86/d3dx/rebase_pe.py).
d3dcompiler_42_base = 0x11000000
d3dcompiler_42_rebased_sha256 = "f7b8ea7f447d8cfe279d021a4febba5389a792ca3ee9bba43cd973744d44702c"

# --- The build (win-x86/install/lp_build.py), measured on an M2 (8 cores) with the pinned build: what the
# installer says up front and checks before it starts.
build_minutes = 25
# Peak memory of the build, measured (docs/windows/PERFORMANCE.md): what a Mac doesn't have of it goes to swap, on the
# startup disk, wherever the build folder is. Every Mac has this much, since the translator's peak went from 23 GB.
build_peak_memory_bytes = 3221225472
# Left free on the startup disk at the end, for macOS.
startup_margin_bytes = 2147483648
# Peak space in the build folder: the generated C, the objects, the libraries, the app's files.
build_disk_bytes = 2147483648
# What stays afterwards: the app bundle, and the translated libraries kept as a cache.
app_disk_bytes = 167772160
cache_disk_bytes = 146800640
